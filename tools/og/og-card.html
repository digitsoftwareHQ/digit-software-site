<!doctype html>
<!--
  Source for public/assets/digit-social-v5.png (1200x630 social preview card).
  Regenerate: serve the repository root over HTTP (e.g. `python3 -m http.server 4400` from the repo root),
  open http://127.0.0.1:4400/tools/og/og-card.html in a 1200x630 viewport at device scale 1, and capture a PNG.
  Text stays inside a centred safe area so platforms that crop the card keep the message intact.
  The knowledge universe is a deterministic still; nothing in it is real data.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Digit Software social card</title>
    <style>
      @font-face {
        font-family: "Mona Sans";
        src: url("../../node_modules/@fontsource-variable/mona-sans/files/mona-sans-latin-wdth-normal.woff2") format("woff2-variations");
        font-weight: 200 900;
        font-stretch: 75% 125%;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations");
        font-weight: 100 800;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #02040a;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(620px 460px at 860px 330px, rgba(23, 92, 200, 0.3), transparent 70%),
          radial-gradient(900px 400px at 300px -60px, rgba(39, 150, 255, 0.1), transparent 70%),
          #02040a;
        color: #eef2ff;
        font-family: "Mona Sans", sans-serif;
      }
      canvas {
        position: absolute;
        inset: 0;
      }
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(2, 4, 10, 0.85) 0%, rgba(2, 4, 10, 0.5) 40%, rgba(2, 4, 10, 0) 62%);
      }
      .copy {
        position: absolute;
        left: 96px;
        top: 96px;
        width: 760px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 26px;
        font-weight: 650;
        font-stretch: 114%;
        letter-spacing: -0.02em;
      }
      .brand img {
        width: 38px;
        height: 38px;
      }
      .brand span {
        font-weight: 450;
        color: #7c87a6;
      }
      h1 {
        margin: 56px 0 0;
        font-size: 54px;
        line-height: 1.04;
        font-weight: 560;
        font-stretch: 112%;
        letter-spacing: -0.032em;
      }
      h1 span {
        display: block;
      }
      .lit {
        background: linear-gradient(100deg, #7fe3ff 0%, #27c4ff 38%, #6f8dff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .url {
        position: absolute;
        left: 96px;
        bottom: 84px;
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #7c87a6;
      }
      .url b {
        color: #27c4ff;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <canvas id="u" width="1200" height="630"></canvas>
      <div class="shade"></div>
      <div class="copy">
        <div class="brand"><img src="../../public/assets/icon-192.png" alt="" /> Digit <span>Software</span></div>
        <h1>
          <span>Software for businesses</span>
          <span>that can think, operate,</span>
          <span class="lit">and improve on their own.</span>
        </h1>
      </div>
      <div class="url"><b>●</b>&nbsp; digit.software</div>
    </div>
    <script>
      // Deterministic still of the knowledge universe (same grammar as the site's hero).
      const C = ["#36c6ff", "#4fd8b0", "#f3b968", "#d6e2ff", "#8f86ff", "#ff7aa8"];
      const W = [1, 0.6, 0.36, 0.66, 0.56, 0.28];
      let a = 20260920;
      const r = () => {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const nodes = [];
      const total = W.reduce((s, w) => s + w, 0);
      for (let c = 0; c < 6; c++) {
        const phi = Math.acos(1 - (2 * (c + 0.5)) / 6), th = Math.PI * (1 + Math.sqrt(5)) * c, R = 252;
        const cx = R * Math.sin(phi) * Math.cos(th), cy = R * Math.cos(phi) * 0.75, cz = R * Math.sin(phi) * Math.sin(th);
        const n = Math.round((300 * W[c]) / total);
        for (let i = 0; i < n; i++) {
          const hub = i < 3, u = r(), v = r(), w = r();
          const rad = hub ? 6 + 26 * w : 16 + 84 * Math.pow(w, 0.42);
          const t2 = 2 * Math.PI * u, p2 = Math.acos(2 * v - 1);
          nodes.push({ x: cx + rad * Math.sin(p2) * Math.cos(t2), y: cy + rad * Math.cos(p2) * 0.8, z: cz + rad * Math.sin(p2) * Math.sin(t2), c, tier: hub ? 0 : r() < 0.34 ? 1 : 2 });
        }
      }
      const yaw = 0.95, pitch = -0.24, D = 900, f = (300 * D) / 340, X = 860, Y = 330;
      const cy0 = Math.cos(yaw), sy0 = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
      for (const n of nodes) {
        const x1 = n.x * cy0 - n.z * sy0, z1 = n.x * sy0 + n.z * cy0;
        const y2 = n.y * cp - z1 * sp, z2 = n.y * sp + z1 * cp;
        n.k = f / (D + z2);
        n.sx = X + x1 * n.k;
        n.sy = Y + y2 * n.k;
        n.d = Math.max(0, Math.min(1, (n.k / (f / D) - 0.62) / 0.75));
      }
      const g = document.getElementById("u").getContext("2d");
      const sprite = (col) => {
        const s = document.createElement("canvas");
        s.width = s.height = 64;
        const x = s.getContext("2d");
        const v = parseInt(col.slice(1), 16), rr = (v >> 16) & 255, gg = (v >> 8) & 255, bb = v & 255;
        const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
        gr.addColorStop(0, `rgba(${rr},${gg},${bb},0.85)`);
        gr.addColorStop(0.18, `rgba(${rr},${gg},${bb},0.32)`);
        gr.addColorStop(0.45, `rgba(${rr},${gg},${bb},0.08)`);
        gr.addColorStop(1, `rgba(${rr},${gg},${bb},0)`);
        x.fillStyle = gr;
        x.fillRect(0, 0, 64, 64);
        return s;
      };
      const S = C.map(sprite);
      // nebulae
      g.globalCompositeOperation = "lighter";
      for (let c = 0; c < 6; c++) {
        const own = nodes.filter((n) => n.c === c);
        const mx = own.reduce((s, n) => s + n.sx, 0) / own.length, my = own.reduce((s, n) => s + n.sy, 0) / own.length;
        const k = own.reduce((s, n) => s + n.k, 0) / own.length;
        g.globalAlpha = 0.28;
        g.drawImage(S[c], mx - 170 * k, my - 170 * k, 340 * k, 340 * k);
      }
      g.globalCompositeOperation = "source-over";
      // relationships
      g.strokeStyle = "rgba(120,190,255,0.13)";
      g.lineWidth = 1;
      g.beginPath();
      for (const n of nodes) {
        const near = nodes
          .filter((m) => m !== n && m.c === n.c)
          .sort((p, q) => (p.x - n.x) ** 2 + (p.y - n.y) ** 2 + (p.z - n.z) ** 2 - ((q.x - n.x) ** 2 + (q.y - n.y) ** 2 + (q.z - n.z) ** 2))
          .slice(0, n.tier === 2 ? 1 : 2);
        for (const m of near) {
          g.moveTo(n.sx, n.sy);
          g.lineTo(m.sx, m.sy);
        }
      }
      g.stroke();
      // nodes
      nodes.sort((p, q) => p.k - q.k);
      for (const n of nodes) {
        const rr = [4.8, 2.9, 1.7][n.tier] * (n.k / (f / D));
        const al = (0.34 + 0.66 * n.d) * [1, 0.85, 0.58][n.tier];
        if (n.tier < 2) {
          g.globalCompositeOperation = "lighter";
          g.globalAlpha = al * 0.6;
          const gs = rr * (n.tier === 0 ? 9 : 7);
          g.drawImage(S[n.c], n.sx - gs / 2, n.sy - gs / 2, gs, gs);
          g.globalCompositeOperation = "source-over";
        }
        g.globalAlpha = al;
        g.fillStyle = C[n.c];
        g.beginPath();
        g.arc(n.sx, n.sy, rr, 0, Math.PI * 2);
        g.fill();
      }
      g.globalAlpha = 1;
    </script>
  </body>
</html>
